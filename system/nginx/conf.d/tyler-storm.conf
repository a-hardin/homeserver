# Tyler Storm Soccer — Static Site
# SSL is terminated at the VPS — nginx here just routes by Host header over the WireGuard tunnel

server {
    listen 80;
    server_name tylerstormsoccer.com;

    access_log /var/log/nginx/tyler-storm-access.log;
    error_log  /var/log/nginx/tyler-storm-error.log;

    root /var/www/tyler-storm;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Unlisted uniform order form — the unguessable filename is the access control.
    # Nothing links to it, so this header is belt-and-braces against crawlers.
    location ~ ^/kit-[a-f0-9]+\.html$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location /contact {
        proxy_pass http://n8n:5678/webhook/tyler-storm/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tryout {
        proxy_pass http://n8n:5678/webhook/tyler-storm/tryout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /guest {
        proxy_pass http://n8n:5678/webhook/tyler-storm/guest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact match: a prefix match here would also swallow the unlisted kit-*.html page.
    location = /uniform {
        proxy_pass http://n8n:5678/webhook/tyler-storm/uniform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
